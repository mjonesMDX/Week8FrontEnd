<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    <!-- <script src="products.js"></script> -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>

    <div id="app">
        <div v-if="showProduct">
            <h1 v-text = "sitename"></h1>
            <button @click="toggleCheckout">  <i class="fa fa-shopping-cart" aria-hidden="true"></i> Checkout ({{cartItemCount}})</button>
            
            <!-- Product information -->
            <div v-for="product in sortedProducts">
                <figure>
                    <img v-bind:src="imageAddress(product)" width = 300>
                </figure>
                <h2 v-text="product.title"></h2>
                <p v-text="product.description"></p>
                <p>Price: £{{product.price}}</p>
                <p>{{product.availableInventory}} available.</p>
                <p>{{cartProductCount(product.id)}} in cart.</p>
                 <button v-on:click="addItem(product)" v-bind:disabled="!canAddToCart(product)">Add to Cart</button>
            </div>

        </div>  
        <div v-else>
            <h1>Checkout Page</h1>
            <button @click="toggleCheckout"> Return to store </button>

            <p>Title:
                <select v-model="order.title">
                    <option v-for="title in titles">{{title}}</option>
                </select>
            </p>
            <p>First Name: <input v-model="order.firstName"></p>
            <p>Last Name: <input v-model="order.lastName"></p>

            <p>Phone Number: <input v-model="order.telephone"> </p>

            <h2>Summary</h2>
            <p>{{order.title}} {{order.firstName}} {{order.lastName}}</p>
            <p>Telephone: {{order.telephone}}</p>

            <button v-on:click="placeOrder()">Place Order</button>
        </div>   
     
    </div>

    <script type="module">
        const PETSHOP_URL = "https://m012345678910-backend.onrender.com"
        const {createApp} = Vue
        const petstore = createApp({
            data(){
                return{
                    sitename: "Vue.js Pet Depot",
                    products: [],
                    cart:[],
                    showProduct: true,
                    order:{
                        firstName:"",
                        lastName:"",
                        telephone:"",
                        title:""
                    },
                    titles:["Dr","Miss","Mr","Mrs","Ms","Mx"]
                }
            },
            computed:{
                cartItemCount:function(){
                    return this.cart.length;
                },
                sortedProducts:function(){
                    function compare(a,b){
                        if (a.price > b.price) return 1;
                        if (a.price < b.price) return -1;
                        return 0;
                    }
                    return this.products.sort(compare);
                }
            },
            created(){
                this.fetchData();
            },
            methods:{
                async fetchData(){
                    const url = PETSHOP_URL  + "/products";
                    let response = await (fetch (url));
                    this.products = await response.json();
                },
                

                async placeOrder(){
                    await this.postOrder();
                    this.updateProduct(this.products[1]);

                    for (let i = 0; i <this.products.length; i++){
                        if (this.cartProductCount(this.products[i].id) > 0){
                            await this.updateProduct(this.products[i]);
                        }
                    }
                    this.resetOrder();
                },

                async postOrder(){   
                    const url = PETSHOP_URL  + "/orders";

                    // adding cart contents to the order
                    const orderInfo = this.order;
                    orderInfo.cart = this.cart;
                    const options = {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(this.order)
                    }
                    let response = await (fetch (url, options));
                },

                async updateProduct(product){

                    // product.availableInventory = product.availableInventory - this.cartProductCount(product.id);
                    let updateBody = {
                        // _id: new ObjectID(product._id),
                        availableInventory: product.availableInventory - this.cartProductCount(product.id)
                    };

                    const url = PETSHOP_URL  + "/products" + "/" + product._id;
                    const options = {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(updateBody)
                    }
                    let response = await (fetch (url, options));
                },

                
                resetOrder(){
                    // reset order data
                    this.cart = [];
                    this.order.title = "";
                    this.order.firstName = "";
                    this.order.lastName = "";
                    this.order.telephone = "";

                },
                
                imageAddress(product){
                    return PETSHOP_URL +"/" + product.image;
                },
                
                addItem(product){
                    this.cart.push(product.id);
                },
                toggleCheckout(){
                    this.showProduct = this.showProduct ? false : true;
                },
                cartProductCount(id){
                    let count = 0;
                    for(let i = 0; i < this.cart.length; i++) {
                        if (this.cart[i] === id) {
                         count++;
                        }
                    }
                    return count;
                },
                canAddToCart(product){
                    return this.cartProductCount(product.id) < product.availableInventory;
                },
            }
        })
        petstore.mount('#app')
    </script>
    
</body>
</html>
